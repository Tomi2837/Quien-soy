<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3042"><title>Tres preguntas nuestras</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fff9f6,#f6ece7 55%,#efe0da);color:#2d2323;font-family:Arial,sans-serif}.wrap{width:min(680px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.brand{font:700 21px Georgia,serif;margin-bottom:22px}.brand b{color:#b85c6f}.card{background:#fffaf7;border:1px solid #ead8d4;border-radius:26px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 55px #47252b1a;text-align:center}.tag{display:inline-block;background:#f3e1e3;color:#7c3042;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(30px,8vw,46px) Georgia,serif;margin:14px 0}p{color:#746363;line-height:1.5}.q{text-align:left;margin-top:18px;font-weight:700;color:#2d2323}input{width:100%;padding:15px;border:1px solid #ddc9c4;border-radius:14px;font-size:16px;background:#fff}.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:800;background:#7c3042;color:#fff;cursor:pointer;margin-top:18px;text-decoration:none;display:inline-block}.clue{margin-top:20px;background:#f4e0e4;border:1px solid #dfbdc6;color:#7c3042;border-radius:18px;padding:19px;font:bold 22px Georgia,serif}.bad{margin-top:16px;color:#9b3b45;font-weight:700}</style></head><body><div class="wrap"><div class="brand">Te amo <b>cada día más</b></div><section class="card"><span class="tag">Reto extra</span><h1>Tres preguntas nuestras</h1><p>Estas no salen en Google 😈</p><div class="q">1. Es mala y huele a caca</div><input id="r1" placeholder="Respuesta"><div class="q">2. Lo decís cuando te tirás un pedo</div><input id="r2" placeholder="Respuesta"><div class="q">3. Animal que nos representa</div><input id="r3" placeholder="Respuesta"><button class="btn" onclick="checkR()">COMPROBAR</button><div id="res"></div></section></div><script>function norm(s){return s.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ')}function checkR(){const a=norm(r1.value),b=norm(r2.value),c=norm(r3.value);const ok=a==='TITA'&&b==='NO ESCUCHASTE NADA'&&(c==='PATOS'||c==='PATITO');res.innerHTML=ok?'<div class="clue">BIEN. TODAVÍA NO TERMINASTE.</div><a class="btn" href="linterna-8f42.html">SIGUIENTE RETO</a>':'<div class="bad">Alguna está mal 👀</div>'}</script></body></html>
