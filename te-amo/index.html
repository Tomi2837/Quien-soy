<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3042"><title>Te amo cada día más</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff9f6,#f6ece7 55%,#efe0da);color:#2d2323;font-family:Arial,sans-serif;min-height:100vh}a{color:inherit}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:25px 0 55px}.brand{font-family:Georgia,serif;font-size:21px;font-weight:700;margin-bottom:24px}.brand b{color:#b85c6f}.card{background:#fffaf7;border:1px solid #ead8d4;border-radius:26px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 55px #47252b1a;text-align:center}.tag{display:inline-block;background:#f3e1e3;color:#7c3042;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif}h1{font-size:clamp(38px,10vw,68px);line-height:1;margin:14px 0}h2{font-size:clamp(29px,7vw,43px);margin:14px 0}p{line-height:1.55;color:#746363}.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:700;cursor:pointer;background:#7c3042;color:#fff;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;margin:5px}.btn.alt{background:#fff;color:#2d2323;border:1px solid #e7d1cd}.hidden{display:none!important}.clue{margin-top:20px;background:#f4e0e4;border:1px solid #dfbdc6;color:#7c3042;border-radius:18px;padding:19px;font:bold 24px Georgia,serif}.opts{display:grid;gap:10px;margin-top:20px}.opt{padding:15px;border:1px solid #ead8d4;background:#fff;border-radius:15px;font-weight:700;cursor:pointer}.opt.bad{background:#fff0f0;border-color:#e1a6a6;color:#9b3b45}.opt.good{background:#edf7ef;border-color:#aacdb1;color:#31543c}.wordlist{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:16px 0}.pill{border:1px solid #ead8d4;border-radius:999px;padding:7px 10px;font-size:12px}.pill.ok{background:#e9f4ec;color:#31543c}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;max-width:560px;margin:18px auto}.letter{aspect-ratio:1;border:1px solid #ead8d4;background:#fff;border-radius:6px;font-weight:800;font-size:clamp(10px,3vw,17px);padding:0}.letter.sel{outline:2px solid #b85c6f}.letter.found{background:#efd0d6;color:#7c3042}.digits{display:flex;gap:8px;justify-content:center;margin:20px}.digits input{width:62px;height:72px;text-align:center;font-size:34px;border:1px solid #dbc2bd;border-radius:15px}.photo{width:100%;border-radius:18px;display:block}.jigsaw{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:420px;aspect-ratio:1206/1676;margin:18px auto;background:#ddd;border-radius:15px;overflow:hidden}.tile{border:0;background-image:url('./assets/puzzle-photo.webp');background-size:300% 500%;cursor:pointer}.tile.sel{outline:4px solid #b85c6f;z-index:2}.mirror{background:#281f21;color:white;border-radius:20px;padding:28px 15px;font:600 clamp(23px,6vw,36px)/1.35 Georgia,serif;transform:scaleX(-1);margin:20px 0}.couponGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px;text-align:left}.coupon{background:#fff;border:1px solid #ead8d4;border-radius:20px;padding:18px;display:flex;flex-direction:column;min-height:205px}.coupon.special{border:2px solid #b85c6f;background:#fff5f6}.coupon h3{margin:7px 0}.coupon p{font-size:14px;flex:1}.counter{font-size:12px;color:#7b6d6c;margin-bottom:8px}.coupon button{width:100%;margin:0}.coupon.used{opacity:.55}.test{display:grid;gap:9px;text-align:left}.test a{background:#fff;border:1px solid #ead8d4;border-radius:12px;padding:12px;text-decoration:none}.zoom{width:100%;max-height:58vh;object-fit:cover;border-radius:18px}.simons{display:grid;grid-template-columns:repeat(2,110px);justify-content:center;gap:10px;margin:20px}.simons button{height:110px;border:0;border-radius:18px;background:#dcb6bf;font-size:28px}.simons button.flash{background:#7c3042;color:#fff;transform:scale(.96)}@media(max-width:600px){.couponGrid{grid-template-columns:1fr}.card{padding:22px 16px}.grid{gap:2px}.letter{border-radius:4px}.jigsaw{max-width:330px}}
</style></head><body><div class="wrap"><div class="brand">Te amo <b>cada día más</b></div><main id="app"></main></div><script>
const A='./assets/';
const app=document.getElementById('app');const btn=(t,f,c='btn')=>`<button class="${c}" onclick="${f}">${t}</button>`;const link=(t,u,c='btn')=>`<a class="${c}" href="#${u}">${t}</a>`;function page(tag,title,body){app.innerHTML=`<section class="card"><span class="tag">${tag}</span><h2>${title}</h2>${body}</section>`}function clue(s){return `<div class="clue">${s}</div>`}function nav(u){location.hash=u}window.onhashchange=render;
function home(){page('10/10','Te amo cada día más',`<p>Preparé algo para vos. Hay recuerdos, retos, pistas y un regalo al final.</p>${link('EMPEZAR EL JUEGO','/p/rosa-7b31.html')}`)}
function soup(){page('Acertijo 1','Sopa de letras',`<p>Encontrá las 5 palabras. Tocá la primera letra y después la última. Pueden estar en cualquier dirección.</p><div class="wordlist" id="wl"></div><div class="grid" id="wg"></div><div id="res"></div>`);const N=12,words=['GATITO','CALAFATE','DESTINO','AMOR','ETERNO'],g=Array.from({length:N},()=>Array(N).fill(''));[['GATITO',1,1,0,1],['CALAFATE',10,10,0,-1],['DESTINO',2,4,1,1],['AMOR',0,11,1,0],['ETERNO',4,8,1,-1]].forEach(([w,r,c,dr,dc])=>[...w].forEach((x,i)=>g[r+dr*i][c+dc*i]=x));let L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!g[r][c])g[r][c]=L[Math.floor(Math.random()*L.length)];wl.innerHTML=words.map(w=>`<span class="pill" id="w${w}">${w}</span>`).join('');wg.innerHTML=g.flatMap((row,r)=>row.map((x,c)=>`<button class="letter" data-r="${r}" data-c="${c}">${x}</button>`)).join('');let start=null,found=new Set();wg.onclick=e=>{let x=e.target.closest('.letter');if(!x)return;let cur={r:+x.dataset.r,c:+x.dataset.c};if(!start){start=cur;x.classList.add('sel');return}let s=start;wg.children[s.r*N+s.c].classList.remove('sel');start=null;let dr=cur.r-s.r,dc=cur.c-s.c;if(!(dr==0||dc==0||Math.abs(dr)==Math.abs(dc)))return;let steps=Math.max(Math.abs(dr),Math.abs(dc)),sr=steps?dr/steps:0,sc=steps?dc/steps:0,arr=[];for(let i=0;i<=steps;i++)arr.push({r:s.r+sr*i,c:s.c+sc*i});let str=arr.map(q=>g[q.r][q.c]).join(''),rev=[...str].reverse().join(''),w=words.find(z=>z===str||z===rev);if(!w)return;found.add(w);arr.forEach(q=>wg.children[q.r*N+q.c].classList.add('found'));document.getElementById('w'+w).classList.add('ok');if(found.size===5)res.innerHTML=clue('FIJATE ABAJO DE LA CAMA')};}
function santorini(){page('Acertijo 2','¿Dónde soñamos viajar juntos?',`<div class="opts" id="o"><button class="opt">ROMA</button><button class="opt">TUCUMAN</button><button class="opt">EL PARQUE DE LA COSTA</button><button class="opt">SANTORINI</button></div><div id="res"></div>`);o.onclick=e=>{if(!e.target.matches('button'))return;if(e.target.textContent==='SANTORINI'){e.target.classList.add('good');res.innerHTML=clue('FIJATE ABAJO DEL ESCRITORIO')}else e.target.classList.add('bad')}}
function safe(){page('Acertijo 3','Caja fuerte',`<p>No hay foto gratis. Sacá el código con estas pistas:</p><p><b>1.</b> Cantidad de letras de "AMOR" menos 4.<br><b>2.</b> Mes de nuestro aniversario menos 6.<br><b>3.</b> La mitad de 4.</p><div class="digits"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div>${btn('ABRIR','checkSafe()')}<div id="res"></div>`)}function checkSafe(){let v=[...document.querySelectorAll('.digits input')].map(x=>x.value).join('');res.innerHTML=v==='042'?clue('FIJATE DONDE A NALITA LE DA MIEDO'):'<p>No abre. Pensalo de nuevo 😈</p>'}
function puzzle(){page('Acertijo 4','Rompecabezas · 15 piezas',`<p>Tocá dos piezas para intercambiarlas. Armá la foto completa.</p><div class="jigsaw" id="jg"></div><p id="moves"></p><div id="res"></div>`);let a=[...Array(15).keys()];do a.sort(()=>Math.random()-.5);while(a.every((v,i)=>v===i));let selected=null,m=0;function draw(){jg.innerHTML=a.map((orig,pos)=>{let r=Math.floor(orig/3),c=orig%3;return `<button class="tile ${selected===pos?'sel':''}" data-p="${pos}" style="background-position:${c*50}% ${r*25}%"></button>`}).join('');moves.textContent=`Movimientos: ${m}`;if(a.every((v,i)=>v===i))res.innerHTML=clue('TIENE FRENADAS DE CACA')}draw();jg.onclick=e=>{let t=e.target.closest('.tile');if(!t)return;let p=+t.dataset.p;if(selected===null){selected=p}else{[a[selected],a[p]]=[a[p],a[selected]];selected=null;m++}draw()}}
function nalita(){page('Acertijo 5','¿Quién ama más a quién?',`<p>Hay una respuesta correcta... pero todavía no está acá.</p><div class="opts" id="o"><button class="opt">Yo te amo más</button><button class="opt">Vos me amás más</button><button class="opt">Nos amamos igual</button><button class="opt">Nalita nos ama más</button></div><div id="extra"></div><div id="res"></div>`);let bad=new Set();o.onclick=e=>{let b=e.target.closest('.opt');if(!b||b.disabled)return;b.classList.add('bad');b.disabled=true;bad.add(b.textContent);if(bad.size===4)extra.innerHTML='<button class="opt good" id="trueLove">TODOS AMAMOS A NALITA</button>'};extra.onclick=e=>{if(e.target.id==='trueLove')res.innerHTML=clue('MIRÁ MI PANZA')}}
function mirror(){page('Acertijo 6','Mensaje espejo',`<div class="mirror">LA SIGUIENTE PISTA NO LA VAS A SABER A MENOS QUE ME DES ALGO QUE TE HAGA ACORDAR A MÍ</div><p>Cuando me lo hayas dado...</p>${btn('YA TE LO DI','showMirror()')}<div id="res"></div>`)}function showMirror(){res.innerHTML=clue('EN DONDE EL TURCO SE AGAZAPA')}
const zooms=[1,2,3,4,5].map(i=>A+'zoom'+i+'.webp');function zoom(){page('Acertijo 7','¿Qué estás mirando?',`<p>Está demasiado cerca. Alejate de a poco.</p><img class="zoom" id="zi" src="${zooms[0]}"><p id="zp">1 / 5</p>${btn('ALEJAR UN POCO','zoomMore()')}<div id="res"></div>`);window.zn=1}function zoomMore(){if(zn<5){zn++;zi.src=zooms[zn-1];zp.textContent=zn+' / 5'}else res.innerHTML=clue('LA SIGUIENTE PISTA ESTÁ PEGADA EN EL ELEMENTO')}
function riddles(){page('Reto extra','Tres adivinanzas',`<p>Resolvé las tres. Sin opciones.</p><input id="r1" placeholder="1. Cuanto más le quitás, más grande se hace" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:5px"><input id="r2" placeholder="2. Tiene ciudades pero no casas" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:5px"><input id="r3" placeholder="3. Se rompe cuando lo nombrás" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:5px">${btn('COMPROBAR','checkR()')}<div id="res"></div>`)}function norm(s){return s.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function checkR(){let ok=norm(r1.value)==='AGUJERO'&&norm(r2.value)==='MAPA'&&norm(r3.value)==='SILENCIO';res.innerHTML=ok?`${clue('BIEN. TODAVÍA NO TERMINASTE.')}${link('SIGUIENTE RETO','/p/linterna-8f42.html')}`:'<p>Alguna está mal.</p>'}
function code(){page('Reto extra','Código secreto',`<p>Descifrá esto moviendo cada letra <b>3 lugares hacia atrás</b>:</p><div class="clue">ILMDWH HQ PLV</div><input id="cod" placeholder="Escribí la frase" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0"><p>Después ordená estas letras:</p><div class="clue">Z A P A T I L L A S</div><input id="ana" placeholder="Palabra" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0">${btn('DESBLOQUEAR','checkCode()')}<div id="res"></div>`)}function checkCode(){let ok=norm(cod.value)==='FIJATE EN MIS'&&norm(ana.value)==='ZAPATILLAS';res.innerHTML=ok?clue('FIJATE EN MIS ZAPATILLAS'):'<p>Todavía no 😈</p>'}
function final(){page('Final','Terminaste el juego ♡',`<p>Recorriste pistas, armaste cosas, pensaste y puteaste un poquito probablemente.</p><h3>Tu regalo final es la cuponera.</h3>${link('ABRIR MI REGALO','/cupones.html')}`)}
const coupons=[['masaje','MASAJE GRATIS','Un masaje hecho por mí. Sin apuro.'],['comida','COMIDA A ELECCIÓN','Elegís qué querés comer y yo me encargo.'],['peli','PELÍCULA JUNTOS','Elegís película y plan.'],['sexo','SEXO DURO ON DEMAND','Canjeable cuando tengas ganas.'],['libro','LEERTE UN LIBRO','Yo te leo lo que elijas.'],['abrazo','ABRAZO','Un abrazo largo, sin límite de tiempo.'],['beso','BESO','Un beso reclamable cuando quieras.'],['celu','DEJAR EL CELULAR','Dejo el celular y mi atención es toda tuya.'],['hacer','DEJAR LO QUE ESTOY HACIENDO Y HACER...','Vos completás la frase.'],['plato','CAMBIO DE PLATO DE COMIDA','Si preferís el mío, cambiamos.'],['tarea','PASO DE TAREA','Eso que no querés hacer pero tenés que hacer: lo hago yo.'],['free','FREE TICK','Acá podes pedirme lo que sea.'],['regalo','VALE POR UN REGALO','VENCE HOY. Este es el cupón especial del aniversario.']];function couponsPage(){page('Tu regalo','Cuponera de amor',`<p>Todos los cupones tienen <b>3 usos</b>. Cada canje descuenta uno y queda guardado en este celular.</p><div class="couponGrid" id="cg"></div><p style="margin-top:22px"><button class="btn alt" onclick="resetCoupons()">Resetear cupones</button></p>`);drawCoupons()}function state(){try{return JSON.parse(localStorage.getItem('teamo_cupones_final')||'{}')}catch{return{}}}function drawCoupons(){let s=state();cg.innerHTML=coupons.map(([id,n,d])=>{let used=s[id]||0,left=3-used;return `<article class="coupon ${id==='regalo'?'special':''} ${left<=0?'used':''}"><span class="tag">${id==='regalo'?'ESPECIAL · VENCE HOY':'VALE POR'}</span><h3>${n}</h3><p>${d}</p><div class="counter">Usos disponibles: <b>${left}/3</b></div><button class="btn" ${left<=0?'disabled':''} onclick="redeem('${id}')">${left<=0?'AGOTADO':'CANJEAR 1 USO'}</button>${id==='regalo'&&used>0?clue('BUSCA ARRIBA DEL MUEBLE DE NALTA'):''}</article>`}).join('')}function redeem(id){let s=state(),u=s[id]||0;if(u>=3)return;if(!confirm('¿Canjear un uso de este cupón?'))return;s[id]=u+1;localStorage.setItem('teamo_cupones_final',JSON.stringify(s));drawCoupons();if(id==='regalo')setTimeout(()=>document.querySelector('.coupon.special').scrollIntoView({behavior:'smooth'}),50)}function resetCoupons(){if(confirm('¿Resetear todos los usos?')){localStorage.removeItem('teamo_cupones_final');drawCoupons()}}
function test(){let rs=[['Sopa nueva','/p/rosa-7b31.html'],['Santorini','/p/isla-91c2.html'],['Caja fuerte','/p/corazon-44a8.html'],['Rompecabezas','/p/piezas-5d70.html'],['Quién ama más','/p/nalita-a1f6.html'],['Espejo','/p/espejo-c8d4.html'],['Zoom','/p/zoom-31e9.html'],['Adivinanzas','/p/adivinanzas-9c21.html'],['Código final','/p/linterna-8f42.html'],['Final → cuponera','/p/final-b7c1.html'],['Cuponera','/cupones.html']];page('Panel Tomi','Prueba rápida',`<div class="test">${rs.map(x=>`<a href="#${x[1]}">${x[0]}</a>`).join('')}</div>`)}
function render(){let p=(location.hash||'#/').slice(1);p=p.replace(/\/$/,'')||'/';if(p==='/')home();else if(p.includes('rosa-7b31'))soup();else if(p.includes('isla-91c2'))santorini();else if(p.includes('corazon-44a8'))safe();else if(p.includes('piezas-5d70'))puzzle();else if(p.includes('nalita-a1f6'))nalita();else if(p.includes('espejo-c8d4'))mirror();else if(p.includes('zoom-31e9'))zoom();else if(p.includes('adivinanzas-9c21'))riddles();else if(p.includes('linterna-8f42'))code();else if(p.includes('final-b7c1'))final();else if(p.includes('cupones'))couponsPage();else if(p.includes('prueba-tomi-2837'))test();else home()}render();
</script></body></html>
