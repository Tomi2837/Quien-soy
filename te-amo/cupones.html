<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3042"><title>Cuponera de amor</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff9f6,#f6ece7 55%,#efe0da);color:#2d2323;font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:25px 0 55px}.brand{font-family:Georgia,serif;font-size:21px;font-weight:700;margin-bottom:24px}.brand b{color:#b85c6f}.card{background:#fffaf7;border:1px solid #ead8d4;border-radius:26px;padding:clamp(22px,5vw,40px);box-shadow:0 18px 55px #47252b1a;text-align:center}.tag{display:inline-block;background:#f3e1e3;color:#7c3042;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif}h2{font-size:clamp(29px,7vw,43px);margin:14px 0}p{line-height:1.55;color:#746363}.couponGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px;text-align:left}.coupon{background:#fff;border:1px solid #ead8d4;border-radius:20px;padding:18px;display:flex;flex-direction:column;min-height:205px}.coupon.special{border:2px solid #b85c6f;background:#fff5f6;box-shadow:0 10px 30px #7c304222}.coupon h3{margin:7px 0}.coupon p{font-size:14px;flex:1}.counter{font-size:12px;color:#7b6d6c;margin-bottom:8px}.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:700;cursor:pointer;background:#7c3042;color:#fff;width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.alt{background:#fff;color:#2d2323;border:1px solid #e7d1cd;width:auto;margin-top:22px}.used{opacity:.55}.clue{margin-top:14px;background:#f4e0e4;border:1px solid #dfbdc6;color:#7c3042;border-radius:18px;padding:19px;font:bold 22px Georgia,serif}@media(max-width:600px){.couponGrid{grid-template-columns:1fr}.card{padding:22px 16px}}</style></head><body><div class="wrap"><div class="brand">Te amo <b>cada día más</b></div><section class="card"><span class="tag">Tu regalo</span><h2>Cuponera de amor</h2><p>Todos los cupones tienen <b>3 usos</b>. Cada canje descuenta uno y queda guardado en este celular.</p><div class="couponGrid" id="cg"></div><button class="btn alt" onclick="resetCoupons()">Resetear cupones</button></section></div><script>const coupons=[['regalo','VALE POR UN REGALO','VENCE HOY. Este es el cupón especial del aniversario.'],['masaje','MASAJE GRATIS','Un masaje hecho por mí. Sin apuro.'],['comida','COMIDA A ELECCIÓN','Elegís qué querés comer y yo me encargo.'],['peli','PELÍCULA JUNTOS','Elegís película y plan.'],['sexo','SEXO DURO ON DEMAND','Canjeable cuando tengas ganas.'],['libro','LEERTE UN LIBRO','Yo te leo lo que elijas.'],['abrazo','ABRAZO','Un abrazo largo, sin límite de tiempo.'],['beso','BESO','Un beso reclamable cuando quieras.'],['celu','DEJAR EL CELULAR','Dejo el celular y mi atención es toda tuya.'],['hacer','DEJAR LO QUE ESTOY HACIENDO Y HACER...','Vos completás la frase.'],['plato','CAMBIO DE PLATO DE COMIDA','Si preferís el mío, cambiamos.'],['tarea','PASO DE TAREA','Eso que no querés hacer pero tenés que hacer: lo hago yo.'],['free','FREE TICK','Acá podés pedirme lo que sea.']];function state(){try{return JSON.parse(localStorage.getItem('teamo_cupones_final')||'{}')}catch{return{}}}function clue(t){return '<div class="clue">'+t+'</div>'}function draw(){let s=state();cg.innerHTML=coupons.map(([id,n,d])=>{let used=s[id]||0,left=3-used;return '<article class="coupon '+(id==='regalo'?'special ':'')+(left<=0?'used':'')+'"><span class="tag">'+(id==='regalo'?'ESPECIAL · VENCE HOY':'VALE POR')+'</span><h3>'+n+'</h3><p>'+d+'</p><div class="counter">Usos disponibles: <b>'+left+'/3</b></div><button class="btn" '+(left<=0?'disabled':'')+' onclick="redeem(\''+id+'\')">'+(left<=0?'AGOTADO':'CANJEAR 1 USO')+'</button>'+(id==='regalo'&&used>0?clue('FÍJATE ENCIMA DEL MUEBLE DE NALTA'):'')+'</article>'}).join('')}function redeem(id){let s=state(),u=s[id]||0;if(u>=3)return;if(!confirm('¿Canjear un uso de este cupón?'))return;s[id]=u+1;localStorage.setItem('teamo_cupones_final',JSON.stringify(s));draw();if(id==='regalo')setTimeout(()=>document.querySelector('.coupon.special').scrollIntoView({behavior:'smooth',block:'center'}),50)}function resetCoupons(){if(confirm('¿Resetear todos los usos?')){localStorage.removeItem('teamo_cupones_final');draw()}}draw();</script></body></html>
