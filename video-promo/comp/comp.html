<style>
  :root{--crema:#F6F0E5;--hueso:#ECE3D2;--carbon:#1E1B18;--mostaza:#E2A82A;--mostaza-osc:#B9831A;--nogal:#5C3D2E;--roble:#C9A27A;--blanco:#FFFDF9}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--carbon)}
  body{font-family:Manrope,sans-serif;color:var(--carbon);-webkit-font-smoothing:antialiased}

  /* ---------- Teléfono ---------- */
  #phone{position:absolute;width:628px;height:1326.46px;border-radius:78px;background:#151311;transform-origin:50% 50%;

  #rec{position:absolute;left:0;top:72.3px;width:600px;height:1298.46px}
  #sbar{position:absolute;left:0;top:0;width:600px;height:72.3px;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:10px 52px 0 64px;font:700 25px Manrope}

  #island{position:absolute;left:50%;top:18px;width:150px;height:42px;margin-left:-75px;border-radius:21px;background:#0d0c0b;z-index:20}
  .ui{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(1.5384615);transform-origin:0 0;overflow:hidden}
  #screenOff{position:absolute;inset:0;background:#151311;opacity:0;z-index:30}
  #touch{position:absolute;left:0;top:0;z-index:25}
  #touch .dot{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,253,249,.82);
    border:3px solid rgba(30,27,24,.28);box-shadow:0 8px 22px rgba(30,27,24,.35)}
  #touch .ring{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:3px solid rgba(255,253,249,.9)}

  /* Pantalla bloqueada (escena 1) */
  #lock .wall{position:absolute;inset:0;background:#2a221c}

  #lock .fecha{position:absolute;left:0;right:0;top:92px;text-align:center;color:rgba(255,255,255,.85);font:600 17px Manrope}
  .notif{position:absolute;left:10px;width:370px;height:76px;border-radius:22px;background:rgba(246,240,232,.9);padding:11px 14px 0 60px;
    box-shadow:0 6px 18px rgba(0,0,0,.18)}

  /* Chat (escena 8) */
  #chat{background:#EFE8DF}

  #chat .av{position:absolute;left:38px;top:58px;width:40px;height:40px;border-radius:50%;background:#C9A27A;color:#fff;font:700 15px/40px Manrope;text-align:center}
  #chat .nom{position:absolute;left:88px;top:58px;font:700 17px Manrope;color:#1E1B18}
  #chat .est{position:absolute;left:88px;top:80px;font:500 13px Manrope;color:#2f8a57}
  #chat .hoy{position:absolute;left:50%;top:128px;transform:translateX(-50%);background:#fffdf9;border-radius:8px;padding:4px 10px;font:600 12px Manrope;color:#6b625a}
  #chat .scroll{position:absolute;left:0;right:0;top:112px;bottom:64px;overflow:hidden}
  #chat .inner{position:absolute;left:0;right:0;top:48px}
  .burb{position:relative;margin:0 0 10px 12px;max-width:336px;background:#fff;border-radius:0 12px 12px 12px;padding:9px 11px 20px;
    font:500 13.6px/1.42 Manrope;color:#151311;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
  .burb b{font-weight:800}
  .burb .h{position:absolute;right:9px;bottom:5px;font:500 11px Manrope;color:#8a8076}
  .burb.out{margin:0 12px 10px auto;background:#D9F7CF;border-radius:12px 0 12px 12px;max-width:300px;padding-right:58px}
  #chat .bar{position:absolute;left:0;right:0;bottom:0;height:64px;background:#EFE8DF}
  #chat .campo{position:absolute;left:10px;right:62px;bottom:12px;height:42px;border-radius:21px;background:#fff;font:500 15px/42px Manrope;color:#9a9088;padding-left:16px}
  #chat .mic{position:absolute;right:10px;bottom:12px;width:42px;height:42px;border-radius:50%;background:#1f8a4c}

  /* ---------- Tipografía y máscaras ---------- */
  .tb{position:absolute;left:96px}
  .line{display:block;overflow:hidden;padding:.06em 0 .14em;margin:-.06em 0 -.14em}
  .line > span,.w > span{display:inline-block;will-change:transform}
  .w{display:inline-block;overflow:hidden;padding:.06em 0 .16em;margin:-.06em 0 -.16em;vertical-align:top}
  .h1{font-family:Fraunces,serif;font-weight:600;font-size:96px;line-height:1.02;letter-spacing:-.012em;font-variation-settings:"opsz" 96}
  .h1 i{font-style:italic;font-weight:500}
  .mono{font-family:"JetBrains Mono",monospace}
  #hud{position:absolute;left:96px;top:196px;display:flex;align-items:center;gap:18px;font:500 25px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--carbon)}

  .pill{position:absolute;left:96px;display:flex;align-items:center;gap:14px;height:68px;padding:0 26px;border-radius:34px;font:600 30px "JetBrains Mono",monospace;letter-spacing:.04em;overflow:hidden}
  #topband{position:absolute;left:0;right:0;top:0;height:720px;background:linear-gradient(to bottom,rgba(246,240,229,.97) 0,rgba(246,240,229,.94) 520px,rgba(246,240,229,0) 720px);opacity:0}

  /* Morph y tarjetas */
  #morph{position:absolute;display:none;overflow:hidden}
  #cota{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
  #corte{position:absolute;left:70px;top:610px;width:940px;border-radius:28px;background:var(--blanco);box-shadow:0 40px 80px -30px rgba(30,27,24,.45);overflow:hidden;display:none;transform-origin:0 0}
  #corte .cab{display:grid;grid-template-columns:1fr 330px 120px;align-items:center;height:72px;padding:0 34px;background:var(--carbon);color:var(--crema);font:600 22px "JetBrains Mono",monospace;letter-spacing:.12em}
  #corte .fila{position:relative;display:grid;grid-template-columns:1fr 330px 120px;align-items:center;height:70px;padding:0 34px;border-bottom:1px solid #E7DECF}
  #corte .fila:nth-child(odd){background:#FBF7F0}
  #corte .fila .hl{position:absolute;inset:6px 12px;border-radius:14px;background:var(--mostaza);transform-origin:0 50%;transform:scaleX(0)}
  #corte .fila .c{position:relative;overflow:hidden;padding:.08em 0 .14em}
  #corte .fila .c > span{display:inline-block}
  #corte .fila .p{font:600 31px Manrope}
  #corte .fila .m,#corte .fila .q{font:500 30px "JetBrains Mono",monospace}
  #corte .fila .q{text-align:right}
  #corte .pie{height:96px;display:flex;align-items:center;padding:0 34px;font:500 27px "JetBrains Mono",monospace;color:#5E5249}
  #veil{position:absolute;inset:0;background:var(--crema);opacity:0}
  #bubbleMorph{position:absolute;display:none}

  /* Cierre */
  #fin{position:absolute;inset:0;transform-origin:540px 960px}
  #pillCta{position:absolute;display:none;overflow:hidden}
  #pillCta .t{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:800 44px Manrope;color:var(--carbon);letter-spacing:-.01em}
  #logoMask{position:absolute;left:390px;top:806px;width:300px;height:330px;overflow:hidden}
  #logo{position:absolute;left:25px;top:20px;width:250px;height:280px;background:#fff;border-radius:16px;transform:rotate(-4deg);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  #logo .l{position:absolute;left:0;right:0;text-align:center;font:800 92px/1 Manrope;letter-spacing:-.06em;color:#1E1B18}
  #logo .u{position:absolute;left:18px;right:18px;bottom:-10px;height:14px;background:#C2449A;border-radius:7px;transform:rotate(-3deg)}

  #grain{position:absolute;inset:-128px;opacity:.085;mix-blend-mode:overlay;pointer-events:none;background-size:256px 256px}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 70% at 50% 46%,rgba(0,0,0,0) 62%,rgba(25,16,8,.12) 100%)}
</style>

<body>
<div id="frame">
  <div id="bg"></div>
  <div id="stage">
    <svg id="cota" viewBox="0 0 1080 1920"></svg>
    <div id="phone">
      <div id="screen">
        <img id="rec" alt="">
        <div id="sbar"><span>15:30</span><svg viewBox="0 0 96 22"><g fill="currentColor"><rect x="0" y="14" width="5" height="8" rx="1.5"/><rect x="8" y="10" width="5" height="12" rx="1.5"/><rect x="16" y="6" width="5" height="16" rx="1.5"/><rect x="24" y="2" width="5" height="20" rx="1.5"/><path d="M44 8a14 14 0 0 1 18 0l-2.4 2.6a10.5 10.5 0 0 0-13.2 0zM48.4 12.6a8 8 0 0 1 9.2 0L53 17.4z"/><rect x="68" y="3" width="24" height="16" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="71" y="6" width="17" height="10" rx="2"/><rect x="93.5" y="8.5" width="2.5" height="5" rx="1"/></g></svg></div>
        <div class="ui" id="lock">
          <div class="wall"><img src="../renders/comoda-roble.jpg" alt=""></div>

          <div class="top"><div class="back">‹</div><div class="av">LG</div><div class="nom">Laura Gómez</div><div class="est">en línea</div></div>
          <div class="scroll"><div class="hoy">Hoy</div><div class="inner" id="chatInner"></div></div>

    <div id="textos"></div>
    <div id="fin"><div id="pillCta"><div class="t" id="ctaTxt"></div></div><div id="logoMask"><div id="logo"><div class="l" style="top:22px">NA</div><div class="l" style="top:104px">LT</div><div class="l" style="top:186px">A</div><div class="u"></div></div></div></div>
  </div>
  <div id="grain"></div>

</div>
<script src="meta.js"></script>
<script>
/* =====================================================================
   Motor de animación: todo se calcula a partir del tiempo t (segundos),
   así cada cuadro se puede renderizar de forma exacta y repetible.
   ===================================================================== */
const W = 1080, H = 1920, FPS = 30, DUR = 50, REC0 = 14.4;           // REC0: la grabación arranca en 14,4 s
const SC = 600 / 390, BZ = 14, PHW = 628, PHH = 1326.46;
const M = window.META;
const $ = (s) => document.querySelector(s);

function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 40; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; } return sy(t); };
}
const eOut = bezier(0.22, 1, 0.36, 1);       // salida suave (texto, entradas)
const eIO = bezier(0.65, 0, 0.35, 1);        // cámara y transformaciones
const eIn = bezier(0.55, 0, 0.75, 0.25);     // salidas
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const mix = (a, b, k) => Array.isArray(a) ? a.map((v, i) => lerp(v, b[i], k)) : lerp(a, b, k);
// pista de keyframes: [[t, valor, ease?], ...]
function tr(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i], [t0, v0] = keys[i - 1];
    if (t <= t1) return mix(v0, v1, (e || eIO)(pr(t, t0, t1)));
  }
  return keys[keys.length - 1][1];
}
const rgb = (c) => `rgb(${c.map((v) => Math.round(v)).join(',')})`;
const CREMA = [246, 240, 229], CARBON = [30, 27, 24], MOSTAZA = [226, 168, 42];

/* ---------- Teléfono y cámara ---------- */
function phoneAt(t) {          // centro (x,y) y escala del teléfono en el escenario
  return {
    x: 540,
    y: tr(t, [[0, 2500], [0.95, 1250, eOut], [3.2, 1250], [9.3, 1250], [13.4, 1250], [14.3, 1223]]),
    s: tr(t, [[0, 0.8], [4.05, 0.8], [4.1, 0.86], [13.4, 0.86], [14.3, 1]]),
  };
}
// punto de la pantalla (px CSS del celular, 390x844) -> escenario
function p2s(t, x, y) {
  const P = phoneAt(t);
  return [P.x + (BZ + x * SC - PHW / 2) * P.s, P.y + (BZ + y * SC - PHH / 2) * P.s];
}
const SB = 47;                                         // alto de la barra de estado del celular (px CSS)
const p2r = (t, x, y) => p2s(t, x, y + SB);           // punto de la grabación -> escenario
const rectAt = (f, sel) => (M.frames[String(f)] || {})[sel];
const centro = (r) => [r[0] + r[2] / 2, r[1] + r[3] / 2];
// foco de cámara sobre un elemento grabado (frame de la grabación)
function foco(f, sel, dx = 0, dy = 0) { const c = centro(rectAt(f, sel)); return p2r(20, c[0] + dx, c[1] + dy); }
const ID = { f: [540, 960], s: 1, a: [540, 960] };
const VISOR = foco(200, '#visor', 0, 20);
const PRECIO = foco(360, '#chip-precio');
const TOAST = foco(420, '#toast');
const COLORES = foco(300, '#colores', 0, -30);
const PED = foco(830, '#estado-3', 0, -120);
const CHIPS = p2r(20, 195, 205);
// cámara: foco (punto del escenario), escala y ancla (punto de pantalla donde cae el foco)
const CAM = [
  [0, ID], [0.9, ID], [3.1, { f: p2s(2, 195, 300), s: 1.18, a: [540, 1060] }],
  [3.6, { f: p2s(2, 195, 300), s: 1.18, a: [540, 1060] }], [4.2, ID],
  [10.0, ID], [13.1, { f: [540, 1250], s: 1.06, a: [540, 1250] }], [14.2, ID],
  [16.15, ID], [16.65, { f: CHIPS, s: 1.12, a: [540, 1080] }], [17.45, { f: CHIPS, s: 1.12, a: [540, 1080] }], [18.05, ID],
  [20.3, ID], [21.05, { f: VISOR, s: 1.38, a: [540, 1150] }], [22.55, { f: VISOR, s: 1.38, a: [540, 1150] }],
  [23.25, { f: COLORES, s: 1.22, a: [540, 1180] }], [24.05, { f: COLORES, s: 1.22, a: [540, 1180] }],
  [24.7, { f: VISOR, s: 1.42, a: [540, 1150] }], [26.15, { f: VISOR, s: 1.42, a: [540, 1150] }],
  [26.9, { f: PRECIO, s: 1.75, a: [640, 1180] }], [27.55, { f: PRECIO, s: 1.75, a: [640, 1180] }],
  [28.15, { f: TOAST, s: 1.3, a: [540, 1220] }], [29.3, { f: TOAST, s: 1.3, a: [540, 1220] }], [30.0, ID],
  [35.2, ID], [38.4, { f: [540, 1223], s: 1.08, a: [540, 1262] }], [39.25, ID],
  [40.85, ID], [41.6, { f: PED, s: 1.3, a: [540, 1180] }], [43.4, { f: PED, s: 1.3, a: [540, 1180] }], [44.3, ID],
];
function camAt(t) {
  let k = 0; while (k < CAM.length - 1 && CAM[k + 1][0] <= t) k++;
  const [t0, c0] = CAM[k], nx = CAM[Math.min(k + 1, CAM.length - 1)];
  const q = nx === CAM[k] ? 0 : eIO(pr(t, t0, nx[0])), c1 = nx[1];
  const c = { f: mix(c0.f, c1.f, q), s: lerp(c0.s, c1.s, q), a: mix(c0.a, c1.a, q) };
  // respiración de cámara en mano, muy sutil
  c.a = [c.a[0] + Math.sin(t * 0.9) * 1.6 + Math.sin(t * 2.3) * 0.8, c.a[1] + Math.cos(t * 0.7) * 1.8];
  return c;
}
const s2v = (c, p) => [c.a[0] + c.s * (p[0] - c.f[0]), c.a[1] + c.s * (p[1] - c.f[1])];   // escenario -> pantalla

/* ---------- Textos con máscara ---------- */
const TEXTOS = [];
function texto(lineas, { x = 96, y, size = 96, color = '#1E1B18', tin, tout, modo = 'line', clase = 'h1', st, align = 'left', w }) {
  const el = document.createElement('div'); el.className = 'tb ' + clase;
  el.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;color:${color};text-align:${align};${w ? 'width:' + w + 'px;' : ''}`;
  const unidades = [];
  for (const ln of lineas) {
    const wrap = document.createElement('div'); wrap.className = 'line';
    if (modo === 'word') {
      wrap.style.overflow = 'visible';
      ln.split(/(?<=\s)/).forEach((pal) => { const m = document.createElement('span'); m.className = 'w'; const s = document.createElement('span'); s.innerHTML = pal.replace(/ $/, '&nbsp;'); m.appendChild(s); wrap.appendChild(m); unidades.push(s); });
    } else { const s = document.createElement('span'); s.innerHTML = ln; wrap.appendChild(s); unidades.push(s); }
    el.appendChild(wrap);
  }
  $('#textos').appendChild(el);
  const o = { el, unidades, tin, tout, st: st || (modo === 'word' ? 0.055 : 0.07) };
  TEXTOS.push(o); return o;
}
function pintarTexto(o, t) {
  const fin = o.tout == null ? Infinity : o.tout + o.unidades.length * 0.045 + 0.5;
  if (t < o.tin - 0.01 || t > fin) { o.el.style.display = 'none'; return; }
  o.el.style.display = 'block';
  o.unidades.forEach((s, i) => {
    let y = (1 - eOut(pr(t, o.tin + i * o.st, o.tin + i * o.st + 0.78))) * 118;
    if (o.tout != null) y -= eIn(pr(t, o.tout + i * 0.045, o.tout + i * 0.045 + 0.46)) * 118;
    s.style.transform = `translateY(${y.toFixed(2)}%)`;
  });
}

/* ---------- Escena 1: notificaciones ---------- */
const NOTIFS = [
  [0.95, 'Laura', 'Hola! cuánto sale un placard de 2 metros?'],
  [1.40, 'Diego M.', 'precio?'],
  [1.80, 'Caro Benítez', 'Hacen cocinas? Me pasás precio'],

    const c2 = camAt(34.9), p = s2v(c2, p2s(34.9, 12, 160)), q = s2v(c2, p2s(34.9, 348, 640));
    const to = [p[0], p[1], q[0] - p[0], q[1] - p[1]];
    const m = eIO(pr(t, 34.0, 34.85));
    bm.style.cssText = `display:${t < 34.95 ? 'block' : 'none'};left:${lerp(from[0], to[0], m)}px;top:${lerp(from[1], to[1], m)}px;width:${lerp(from[2], to[2], m)}px;height:${lerp(from[3], to[3], m)}px;border-radius:${lerp(14, 16, m)}px;background:${rgb(mix(MOSTAZA, [255, 255, 255], m))};opacity:${1 - eIn(pr(t, 34.82, 34.95))}`;
  } else bm.style.display = 'none';
}

/* ---------- Escena 10: el teléfono se vuelve el botón ---------- */
function pintarFin(t) {
  const pill = $('#pillCta');
  const fin = $('#fin'); fin.style.display = t > 44.6 ? 'block' : 'none';
  fin.style.transform = `scale(${lerp(1, 1.025, eIO(pr(t, 45.5, 49.4)))})`;
  if (t < 44.7) { pill.style.display = 'none'; return; }
  const from = [226, 559.8, 628, 1326.5], to = [190, 1262, 700, 128];
  const k = eIO(pr(t, 44.72, 45.6));
  pill.style.display = 'block';
  pill.style.left = lerp(from[0], to[0], k) + 'px'; pill.style.top = lerp(from[1], to[1], k) + 'px';
  pill.style.width = lerp(from[2], to[2], k) + 'px'; pill.style.height = lerp(from[3], to[3], k) + 'px';
  pill.style.borderRadius = lerp(78, 64, k) + 'px';
  pill.style.background = rgb(mix([21, 19, 17], MOSTAZA, eIO(pr(t, 44.9, 45.5))));
  $('#ctaTxt').innerHTML = '<span style="display:inline-block">Pedí tu demo gratis&nbsp;&nbsp;→</span>';
  const ky = (1 - eOut(pr(t, 45.72, 46.4))) * 140;
  $('#ctaTxt').style.clipPath = 'inset(0)'; $('#ctaTxt').firstChild.style.transform = `translateY(${ky.toFixed(1)}%)`;
  // logo: sube desde atrás de un borde invisible
  const kl = eOut(pr(t, 46.05, 46.85));
  $('#logo').style.transform = `translateY(${((1 - kl) * 330).toFixed(1)}px) rotate(${lerp(4, -4, kl).toFixed(2)}deg)`;
}
